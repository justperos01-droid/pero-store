<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PERO STORE — Login</title><link rel="stylesheet" href="style.css">
</head>
<body class="auth">
<div class="bg"></div><div class="aura a1"></div><div class="aura a2"></div>

<section class="card" id="authCard">
  <div class="brand">PERO <span>STORE</span></div>

  <div id="loginView" class="view active">
    <h1>Welcome back</h1>
    <p class="sub">Login to continue shopping</p>
    <form id="loginForm">
      <label>Username or Email
        <input id="identity" required placeholder="Enter your username or email">
      </label>
      <label>Password
        <div class="pw"><input id="password" type="password" required placeholder="Enter your password">
        <button class="eye" type="button" data-for="password">◉</button></div>
      </label>
      <div class="options">
        <label><input id="remember" type="checkbox"> Remember me</label>
        <a href="#" id="forgot">Forgot password?</a>
      </div>
      <div id="error" class="msg"></div>
      <button class="primary" type="submit">Login</button>
    </form>
    <div class="or"><span>OR</span></div>
    <button class="google" id="google" type="button">ⓖ &nbsp; Login with Google</button>
    <p class="bottom">Don't have an account? <button class="link-btn" id="toRegister" type="button">Register here</button></p>
  </div>

  <div id="registerView" class="view">
    <button class="back" id="toLogin" type="button">←</button>
    <h1>Create an account</h1>
    <p class="sub">Register to start shopping</p>
    <form id="registerForm">
      <label>Username<input id="username" required placeholder="Enter your username"></label>
      <label>Email<input id="email" type="email" required placeholder="Enter your email"></label>
      <label>Password><div class="pw"><input id="regPass" type="password" required placeholder="Create a password">
        <button class="eye" type="button" data-for="regPass">◉</button></div></label>
      <label>Confirm Password<div class="pw"><input id="confirm" type="password" required placeholder="Repeat your password">
        <button class="eye" type="button" data-for="confirm">◉</button></div></label>
      <label>Referral Code <em>(optional)</em><input id="referral" placeholder="Enter referral code"></label>
      <label class="terms"><input id="terms" type="checkbox" required><span>I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></span></label>
      <div id="regError" class="msg"></div><div id="success" class="success"></div>
      <button class="primary" type="submit">Create Account</button>
    </form>
    <p class="bottom">Already have an account? <button class="link-btn" id="loginHere" type="button">Login here</button></p>
  </div>
</section>

<script src="script.js"></script>
</body></html>
